[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "speaking-clock"
version = "1.2.0"
description = "A clock that speaks the current time using ElevenLabs API"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Marcin Orlowski", email = "mail@marcinorlowski.com"}
]
dependencies = [
    # 2.0 dropped client.generate() in favour of client.text_to_speech.convert()
    "elevenlabs>=2.0",
    "PyYAML",
    "python-dateutil",
    "num2words",
    "pydub",
    "numpy",
    # pydub imports the stdlib `audioop` module, removed in Python 3.13 (PEP 594).
    # Without this shim pydub fails to import and volume control silently degrades.
    "audioop-lts; python_version >= '3.13'",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "wheel",
    "wemake-python-styleguide",
]

[project.urls]
Homepage = "https://github.com/MarcinOrlowski/speaking-clock"

[project.scripts]
speaking-clock = "speaking_clock.cli:main"
speak-time = "speaking_clock.cli:main"

[tool.setuptools.packages.find]
include = ["speaking_clock", "speaking_clock.*"]

[tool.setuptools.package-data]
speaking_clock = ["data/*.mp3", "data/defaults/*.yml", "languages/*.yml"]
