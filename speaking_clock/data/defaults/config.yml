##################################################################################

language:
  code: "pl"
  use_24h_clock: true

elevenlabs:
  api_key: "<API KEY>"
  voice_id: "George"
  model_id: "eleven_multilingual_v2"

audio:
  play_chime: true
  chime_file: "clock-chime.mp3"
  overlay_speech: true
  speech_offset_ms: 1000

cache:
  enabled: true
